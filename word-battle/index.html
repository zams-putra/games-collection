<body>
    <section class="arena">
        <div class="char char-1">
            <p class="hp hp-1"></p>
            <img class="kucing1" src="img/car0.jpg" alt="car1">

            </div>

                <button value="s">S</button>
                <button value="t">T</button>
                <button value="u">U</button>

                <button value="w">W</button>
