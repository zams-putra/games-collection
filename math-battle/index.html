<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Battle</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <section class="arena">
        <div class="char char-1">
            <p class="hp hp-1"></p>
            <img class="kucing1" src="img/car0.jpg" alt="car1">
        </div>

        <div class="char char-2">
            <p class="hp hp-2"></p>
            <img  class="kucing2" src="img/car0.jpg" alt="car2">
        </div>
    </section>

    <section class="quiz-area">
        <p class="quiz">1 x 1 = ?</p>
    </section>

    <section class="numpad-area">
        <div class="pad">
            <div class="terminal terminal-1">
                
            </div>
            <div class="numpad numpad-1">
                <button value="1">1</button>
                <button value="2">2</button>
                <button value="3">3</button>
                <button value="4">4</button>
                <button value="5">5</button>
                <button value="6">6</button>
                <button value="7">7</button>
                <button value="8">8</button>
                <button value="9">9</button>
                <button value="0">0</button>
                <button value="submit">submit</button>
                <button value="del"><</button>
            </div>
        </div>
           
        <div class="pad">
            <div class="terminal terminal-2">
                
            </div>
            <div class="numpad numpad-2">
                <button value="1">1</button>
                <button value="2">2</button>
                <button value="3">3</button>
                <button value="4">4</button>
                <button value="5">5</button>
                <button value="6">6</button>
                <button value="7">7</button>
                <button value="8">8</button>
                <button value="9">9</button>
                <button value="0">0</button>
                <button value="submit">submit</button>
                <button value="del"><</button>
            </div>
        </div>
           

        


      
      
    </section>



<script src="./index.js"></script>
</body>
</html>
